format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: steps.bitrise.yml

workflows:
  # check: included from steps-check/steps.bitrise.yml

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
    - TEST_APP_BRANCH: maintenance
    - TEST_APP_MODULE: app
    - TEST_APP_VARIANT: DemoDebug
    - TEST_DEVICES: MediumPhone.arm,33,en,portrait
    steps:
    - script:
        title: Clean _tmp dir
        inputs:
        - content: |-
            #!/bin/env bash
            set -ex
            rm -rf ./_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - branch: $TEST_APP_BRANCH
        - clone_into_dir: ./_tmp
    - android-build-for-ui-testing:
        inputs:
        - project_location: ./_tmp
        - module: $TEST_APP_MODULE
        - variant: $TEST_APP_VARIANT
    - path::./:
        inputs:
        - test_type: instrumentation
        - test_devices: $TEST_DEVICES
        - download_test_results: "true"

  # Rewrites step.yml's device table and the golden list from the live catalog, then regenerates
  # the README. Leaves the changes in the working tree to review and commit.
  maintenance:
    steps:
    - script:
        title: Update step.yml's device table from the live catalog
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail
            # Needs the gcloud CLI, and either an already signed in account or
            # $SERVICE_ACCOUNT_JSON. Without -update the test only reports the drift.
            cd maintenance
            go test -v ./... -update
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: {}

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: {}
