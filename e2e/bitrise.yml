format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
  - TEST_APP_BRANCH: maintenance
  - TEST_APP_MODULE: app
  - TEST_APP_VARIANT: DemoDebug
  - JDK_VERSION: 17
  # Secret env vars have matching key and value
  - GCP_SERVICE_ACCOUNT_JSON_VDT_DEVICE_FETCHER: $GCP_SERVICE_ACCOUNT_JSON_VDT_DEVICE_FETCHER

workflows:
  # `test_` prefix is used by unified CI to filter tests to run

  # The devices are Firebase Test Lab's, so the result does not depend on the stack. Limited to
  # the latest Ubuntu stack on CI, which is also the cheapest place to build an Android app.
  test_flaky_and_quarantined_tests:
    steps:
    - bitrise-run:
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - workflow_id: utility_test_flaky_and_quarantined_tests
        - bitrise_config_path: ./e2e/bitrise.yml

  # The catalog is the same everywhere, so one stack is enough. Running it on all of them also
  # meant 17 gcloud sign-ins per build, any one of which failing takes the whole build down.
  test_device_catalog_up_to_date:
    envs:
    # maintenance_test.go signs in to gcloud with this.
    - SERVICE_ACCOUNT_JSON: $GCP_SERVICE_ACCOUNT_JSON_VDT_DEVICE_FETCHER
    steps:
    - script:
        title: Compare step.yml's device table with the live catalog
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail
            # Its own module, so the Step's `go test ./...` in check does not run it.
            cd maintenance
            go test -v ./...

  utility_test_flaky_and_quarantined_tests:
    envs:
    - TEST_DEVICES: MediumPhone.arm,33,en,portrait
    - NUM_FLAKY_TEST_ATTEMPTS: 2
    - TEST_PACKAGE: sample.results.test.multiple.bitrise.com.multipletestresultssample
    # Two test classes share method names, so this also proves the exclusion is not too broad.
    - QUARANTINED_TEST_CLASS: $TEST_PACKAGE.InstrumentedTest0
    - SIBLING_TEST_CLASS: $TEST_PACKAGE.InstrumentedTest1
    - QUARANTINED_TEST_CASE: correctUITestCase0
    - QUARANTINED_TESTS: |-
        [
          {
            "testCaseName": "$QUARANTINED_TEST_CASE",
            "testSuiteName": [
              ""
            ],
            "className": "$QUARANTINED_TEST_CLASS"
          }
        ]
    after_run:
    - _build_test_apks
    - _run
    - _check_outputs
    - _check_quarantined_test_skipped
    - _deploy_artifacts

  _build_test_apks:
    steps:
    - set-java-version@1:
        run_if: .IsCI
        inputs:
        - set_java_version: $JDK_VERSION
    - script:
        title: Clean _tmp dir
        inputs:
        - content: |-
            #!/bin/env bash
            set -ex
            rm -rf ./_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - branch: $TEST_APP_BRANCH
        - clone_into_dir: ./_tmp
    - install-missing-android-tools:
        run_if: .IsCI
        inputs:
        - gradlew_path: ./_tmp/gradlew
    # Exports $BITRISE_APK_PATH and $BITRISE_TEST_APK_PATH, the Step's input defaults.
    - android-build-for-ui-testing:
        inputs:
        - project_location: ./_tmp
        - module: $TEST_APP_MODULE
        - variant: $TEST_APP_VARIANT

  _run:
    steps:
    - path::./:
        inputs:
        - test_type: instrumentation
        - test_devices: $TEST_DEVICES
        - download_test_results: "true"
        - num_flaky_test_attempts: $NUM_FLAKY_TEST_ATTEMPTS
        - inst_test_targets: package $TEST_PACKAGE
        - quarantined_tests: $QUARANTINED_TESTS
        - use_verbose_log: "true"

  _check_outputs:
    steps:
    - script:
        title: Check VDTESTING_DOWNLOADED_FILES_DIR is exported
        inputs:
        - content: |-
            #!/bin/env bash
            set -e
            if [[ -z "$VDTESTING_DOWNLOADED_FILES_DIR" ]] ; then
              echo "VDTESTING_DOWNLOADED_FILES_DIR should not be empty"
              exit 1
            fi
            echo "VDTESTING_DOWNLOADED_FILES_DIR: $VDTESTING_DOWNLOADED_FILES_DIR"

  _check_quarantined_test_skipped:
    steps:
    - script:
        title: Check if quarantined tests are really skipped
        inputs:
        - content: |-
            #!/bin/env bash
            set -e
            # Result files are named after the device config, `,` replaced by `-`.
            device_slug="$(echo "$TEST_DEVICES" | tr ',' '-')"
            test_results_xml_path="$VDTESTING_DOWNLOADED_FILES_DIR/${device_slug}_test_result_1.xml"

            if [ ! -f "$test_results_xml_path" ]; then
              echo "No test results xml found at: $test_results_xml_path"
              echo "Files present in $VDTESTING_DOWNLOADED_FILES_DIR:"
              ls -1 "$VDTESTING_DOWNLOADED_FILES_DIR"
              exit 1
            fi

            if grep -q "name='$QUARANTINED_TEST_CASE' classname='$QUARANTINED_TEST_CLASS'" "$test_results_xml_path"; then
              echo "The quarantined test was found in the test results xml."
              exit 1
            fi
            echo "The quarantined test was NOT found in the test results xml."

            # The same method in the other class must still have run.
            if ! grep -q "name='$QUARANTINED_TEST_CASE' classname='$SIBLING_TEST_CLASS'" "$test_results_xml_path"; then
              echo "$SIBLING_TEST_CLASS#$QUARANTINED_TEST_CASE is missing, the exclusion was too broad."
              exit 1
            fi

  _deploy_artifacts:
    steps:
    - deploy-to-bitrise-io@2:
        inputs:
        - is_compress: "true"
        - deploy_path: $VDTESTING_DOWNLOADED_FILES_DIR
